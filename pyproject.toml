[project]
name = "ai-chatbot"
version = "0.1.0"
description = "Async CLI AI chatbot powered by local Ollama"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27.0",
  "python-dotenv>=1.0.0",
  "pydantic>=2.0.0",
  "ollama>=0.6.2",
  "rich>=13.0.0",
]

[project.scripts]
ai-chatbot = "ai_chatbot.main:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling>=1.24.2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_chatbot"]
